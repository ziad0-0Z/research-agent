<text x="415.0" y="142.0" text-anchor="middle" font-size="11.5" fill="#55514A" opacity="0.8">assignments valid?</text>
<rect x="567.9" y="103.0" width="144.2" height="54.0" rx="3.0" fill="#EFF6EA" stroke="#C9DFBC" stroke-width="1.2"/>
<text x="640.0" y="127.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#5B9440">Specialists</text>
<text x="640.0" y="142.0" text-anchor="middle" font-size="11.5" fill="#5B9440" opacity="0.8">verified Evidence</text>
