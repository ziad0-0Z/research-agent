<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 300" width="1420" height="300" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="Prompt chaining: plan → evidence → analysis → report" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Prompt chaining: plan → evidence → analysis → report</title>
