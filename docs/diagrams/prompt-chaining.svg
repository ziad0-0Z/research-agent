<text x="1120.0" y="127.0" text-anchor="middle" font-size="14.5" font-weight="600" fill="#5B9440">Writer</text>
<text x="1120.0" y="142.0" text-anchor="middle" font-size="11.5" fill="#5B9440" opacity="0.8">ResearchReport</text>
