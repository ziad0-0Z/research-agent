<text x="710.0" y="40.0" text-anchor="middle" font-size="12.5" font-weight="400" fill="#8A857C">Each step is a typed Pydantic output, stored and shown in the UI before the next step runs.</text>
<rect x="24" y="268" width="22" height="14" rx="7" fill="#FCEDE9" stroke="#EDBFB3"/>
<text x="54.0" y="279.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#8A857C">input / output</text>
